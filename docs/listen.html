<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen along · Pulse Music</title>
<meta name="description" content="Listen along with a friend in Pulse Music: the same song, at the same second.">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --base: #1a0b24; --paper: #fbf7ff; --mist: rgba(251,247,255,.72); --line: rgba(251,247,255,.14); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'Figtree', system-ui, sans-serif; color: var(--paper);
    background: radial-gradient(90% 70% at 15% 10%, #ff4f8b66, transparent 60%), radial-gradient(80% 70% at 90% 90%, #7a2cff77, transparent 60%), var(--base); }
  .card { width: min(460px, calc(100vw - 32px)); padding: 38px 34px; border-radius: 32px; text-align: center; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px var(--line), 0 40px 90px rgba(0,0,0,.45); backdrop-filter: blur(20px); }
  .logo { width: 76px; height: 76px; border-radius: 22px; box-shadow: 0 16px 40px rgba(255,79,139,.35); }
  h1 { margin: 22px 0 8px; font: 800 38px/1 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -.04em; }
  p { margin: 0 0 24px; color: var(--mist); font-size: 17px; line-height: 1.45; }
  .eq { display: inline-flex; gap: 4px; align-items: flex-end; height: 22px; margin-bottom: 4px; }
  .eq i { width: 5px; height: 100%; border-radius: 3px; background: #3ddc84; animation: eq .9s ease-in-out infinite alternate; transform-origin: bottom; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { from { transform: scaleY(.25); } }
  .btn { display: block; padding: 15px 20px; margin-top: 10px; border-radius: 999px; font-weight: 700; font-size: 16px; text-decoration: none; color: var(--base); background: var(--paper); transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn--glass { color: var(--paper); background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px var(--line); }
  small { display: block; margin-top: 18px; color: rgba(251,247,255,.5); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/icon.png" alt="">
    <h1><span id="who">Your friend</span> is listening</h1>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>
    <p>Opening Pulse Music, so you hear the same song at the same second. If nothing happens, you don't have Pulse yet: it's free.</p>
    <a class="btn" id="open" href="#">Open in Pulse Music</a>
    <a class="btn btn--glass" href="https://github.com/Nixinak/pulsemusic-releases/releases/latest/download/PulseMusic-Setup.exe">Download Pulse Music</a>
    <small>Pulse Music for Windows · needs Spotify Premium</small>
  </main>
<script>
  const q = new URLSearchParams(location.search);
  const id = (q.get('u') || '').replace(/[^A-Za-z0-9._-]/g, '').slice(0, 64);
  const name = (q.get('n') || '').slice(0, 60);
  if (name) document.getElementById('who').textContent = name;
  const link = 'pulsemusic://listen?u=' + encodeURIComponent(id) + '&n=' + encodeURIComponent(name);
  const btn = document.getElementById('open');
  btn.href = link;
  if (id) setTimeout(() => { location.href = link; }, 400);
</script>
</body>
</html>
